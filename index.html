<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- OG BUAT WA -->
    <meta id="og-title" property="og:title" content="𝐍𝐄𝐗𝐔𝐒 𝐅𝐀𝐌𝐒">
    <meta id="og-desc" property="og:description" content="Selamat datang di Marga Nexus Fams! ${namaBagus}!">
    <meta id="og-image" property="og:image" content="https://i.postimg.cc/JnsH12rm/file-00000000095881fa8b3a94525e7498b4.png">
    <meta id="og-url" property="og:url" content="https://webnexusfamsofc.starpit.my.id/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <title id="page-title">Nexus Fams</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.12) 0%, transparent 40%);
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow element */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(140px);
            opacity: 0.3;
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
            100% { transform: scale(1.2) translate(20px, -20px); opacity: 0.4; }
        }

        .card {
            background: rgba(15, 18, 28, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding: 52px 40px;
            border-radius: 28px;
            text-align: center;
            max-width: 460px;
            width: 100%;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(99, 102, 241, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes cardAppear {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.96); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .logo {
            font-size: 1.8em;
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            display: inline-block;
            filter: drop-shadow(0 2px 10px rgba(165, 180, 252, 0.3));
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 14px;
            line-height: 1.25;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .sub {
            font-size: 0.98em;
            color: #94a3b8;
            line-height: 1.65;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(129, 140, 248, 0.25);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.85em;
            font-weight: 600;
            color: #818cf8;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            transition: all 0.3s ease;
        }

        .badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #818cf8;
        }

        .badge:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(129, 140, 248, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
                border-radius: 22px;
            }
            h1 {
                font-size: 1.7em;
            }
            .logo {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">𝐍𝐄𝐗𝐔𝐒 𝐅𝐀𝐌𝐒</div>
        <h1 id="sambutan">Selamat Datang!</h1>
        <p class="sub" id="pesan">Terimakasih sudah bergabung bersama keluarga besar kami. Mari berkembang bersama ✨</p>
        <div class="badge">Anggota Baru</div>
    </div>

    <script>
    function getNamaFromURL() {
        // 1. Cek dari Pathname (misal: domain.com/Nama atau domain.com/Nama/)
        const pathParts = window.location.pathname.split('/').filter(part => part && part !== 'index.html');
        if (pathParts.length > 0) {
            return pathParts[0];
        }

        // 2. Cek dari Query Parameter (misal: domain.com/?Nama atau domain.com/?nama=Nama)
        if (window.location.search) {
            const searchParams = new URLSearchParams(window.location.search);
            return searchParams.get('nama') || window.location.search.substring(1);
        }

        // 3. Cek dari Hash (misal: domain.com/#Nama)
        if (window.location.hash) {
            return window.location.hash.substring(1);
        }

        return '';
    }

    const nama = getNamaFromURL();

    if (nama) {
        let namaBagus = nama;
        try {
            namaBagus = decodeURIComponent(nama).replace(/-/g, ' ');
        } catch (e) {
            namaBagus = nama.replace(/-/g, ' ');
        }
        
        document.getElementById('sambutan').innerText = `Selamat Datang, ${namaBagus}!`;
        document.getElementById('pesan').innerText = `Selamat bergabung di Marga Nexus Fams. Semoga betah ya ${namaBagus}! ✨`;
        document.getElementById('page-title').innerText = `Sambutan untuk ${namaBagus}`;

        document.getElementById('og-title').setAttribute('content', `Selamat Datang, ${namaBagus}!`);
        document.getElementById('og-desc').setAttribute('content', `Dia baru saja masuk Marga 𝐍𝐄𝐗𝐔𝐒 𝐅𝐀𝐌𝐒`);
        document.getElementById('og-url').setAttribute('content', `https://webnexusfamsofc.starpit.my.id/${nama}`);
    }
    </script>
</body>
      </html>
